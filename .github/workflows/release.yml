name: Release verified PHP int64

on:
  workflow_run:
    workflows: ['Validate PHP int64']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: int64-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish verified archives
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.5.0'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: int64-php-*
          path: ${{ runner.temp }}/php-int64-release-artifacts
          merge-multiple: true
      - name: Publish the validated version
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/release.sh "$RUNNER_TEMP/php-int64-release-artifacts"
