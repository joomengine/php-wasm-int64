name: Release verified PHP int64

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: int64-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    name: Verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the version tag on the default branch
        id: tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
          printf 'commit=%s\n' "$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

  validate:
    needs: identity
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    name: Publish verified archives
    needs: [identity, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.5.0'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: int64-php-*
          path: ${{ runner.temp }}/php-int64-release-artifacts
          merge-multiple: true
      - name: Publish the validated version
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ needs.identity.outputs.commit }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/release.sh "$RUNNER_TEMP/php-int64-release-artifacts"
