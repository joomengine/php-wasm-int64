name: Validate PHP int64

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: int64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.5.0'
          cache: npm
      - name: Install validation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq shellcheck php-cli
          npm ci --ignore-scripts
      - name: Validate source and fast contracts
        run: bash scripts/check.sh

  runtime:
    name: PHP ${{ matrix.php }} build and runtime
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.5.0'
          cache: npm
      - name: Install test tooling
        timeout-minutes: 20
        run: |
          set -euo pipefail
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-int64-downloads >/dev/null
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit
          docker version
          docker compose version
      - name: Prepare pinned sources and validate the bridge
        id: inputs
        run: |
          bash scripts/prepare.sh "$PHP_VERSION"
          source scripts/common.sh
          select_php "$PHP_VERSION"
          printf 'fingerprint=%s\n' "$BUILD_FINGERPRINT" >> "$GITHUB_OUTPUT"
          VRZNO_SOURCE_ROOT="$VRZNO_DIRECTORY" node --test tests/bridge/source-contract.mjs
          UPSTREAM_SOURCE_ROOT="$UPSTREAM_DIRECTORY" node --test tests/preload-contract.mjs tests/build/stdlib-contract.mjs
      - name: Restore compiled distribution for exact build inputs
        id: compiled-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: dist/php-${{ matrix.php }}
          key: compiled-v1-${{ runner.os }}-${{ runner.arch }}-php${{ matrix.php }}-${{ steps.inputs.outputs.fingerprint }}
      - name: Build pinned PHP and matching extensions
        id: build
        if: steps.compiled-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p logs
          bash scripts/build.sh "$PHP_VERSION" 2>&1 | tee "logs/build-php${PHP_VERSION}.log"
      - name: Verify compiled distribution and build identity
        env:
          EXPECTED_FINGERPRINT: ${{ steps.inputs.outputs.fingerprint }}
        run: |
          artifact="dist/php-$PHP_VERSION"
          node scripts/verify-artifact.mjs "$artifact" "$PHP_VERSION"
          test "$(jq -er '.fingerprint' "$artifact/manifest.json")" = "$EXPECTED_FINGERPRINT"
          test "$(jq -er '.version' "$artifact/manifest.json")" = "$(cat VERSION)"
          expected_php=$(jq -er --arg minor "$PHP_VERSION" '.php[] | select(.minor == $minor) | .version' versions.json)
          test "$(jq -er '.php.version' "$artifact/manifest.json")" = "$expected_php"
      - name: Save compiled distribution before runtime validation
        if: steps.compiled-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: dist/php-${{ matrix.php }}
          key: ${{ steps.compiled-cache.outputs.cache-primary-key }}
      - name: Package and extract the distribution
        id: package
        run: |
          mkdir -p logs
          bash scripts/package.sh "$PHP_VERSION"
          archive="php-wasm-int64-$(cat VERSION)-php${PHP_VERSION}.tar.gz"
          (cd dist/releases && sha256sum --check "$archive.sha256")
          mkdir -p dist/verified
          tar --extract --gzip --file "dist/releases/$archive" --directory dist/verified --no-same-owner
      - name: Verify distribution contents and hashes
        id: verify-extracted
        run: node scripts/verify-artifact.mjs "dist/verified/php-$PHP_VERSION" "$PHP_VERSION"
      - name: Exercise embedded, CLI, CGI and debugger runtimes
        id: node-tests
        timeout-minutes: 15
        run: |
          set -euo pipefail
          node tests/run-runtime.mjs "$PHP_VERSION" "dist/verified/php-$PHP_VERSION" 2>&1 | tee "logs/node-php${PHP_VERSION}.log"
      - name: Exercise Chromium, Firefox and WebKit
        id: browser-tests
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.verify-extracted.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          set -euo pipefail
          node tests/browser-test.mjs "$PHP_VERSION" "dist/verified/php-$PHP_VERSION" 2>&1 | tee "logs/browser-php${PHP_VERSION}.log"
      - name: Require both Node and browser validation to pass
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.verify-extracted.outcome == 'success' }}
        env:
          NODE_RESULT: ${{ steps.node-tests.outcome }}
          BROWSER_RESULT: ${{ steps.browser-tests.outcome }}
        run: |
          test "$NODE_RESULT" = success
          test "$BROWSER_RESULT" = success
      - name: Upload verified archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: int64-php-${{ matrix.php }}
          path: |
            dist/releases/*-php${{ matrix.php }}.tar.gz
            dist/releases/*-php${{ matrix.php }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain unverified archives for failed-runtime debugging
        if: failure() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unverified-php-${{ matrix.php }}
          path: |
            dist/releases/*-php${{ matrix.php }}.tar.gz
            dist/releases/*-php${{ matrix.php }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Collect partial runtime files from a failed build
        if: failure() && steps.build.outcome == 'failure'
        run: |
          source scripts/common.sh
          select_php "$PHP_VERSION"
          mkdir -p logs
          partial_list="$RUNNER_TEMP/int64-partial-runtime-${PHP_VERSION}.list"
          : > "$partial_list"
          if [[ -d "$UPSTREAM_DIRECTORY/packages" ]]; then
            (
              cd "$UPSTREAM_DIRECTORY"
              find packages -mindepth 2 -maxdepth 2 -type f \( \
                -name '*.mjs' -o -name '*.wasm' -o -name '*.so' \
                -o -name '*.dat' -o -name '*.data' -o -name package.json \
                -o -name '*.d.ts' -o -name '*.d.mts' -o -name '*.d.cts' \
              \) -print0
            ) > "$partial_list"
          fi
          if [[ -s "$partial_list" ]]; then
            tar --create --gzip --file logs/partial-runtime.tar.gz \
              --directory "$UPSTREAM_DIRECTORY" --null --files-from "$partial_list"
            printf 'Collected unverified partial runtime files for failed-build debugging.\n'
          else
            printf 'No partial runtime package files were available to collect.\n'
          fi
      - name: Collect configure diagnostics
        if: always()
        run: |
          if [[ -d .build ]]; then
            mkdir -p logs
            log_list="$RUNNER_TEMP/int64-configure-logs-${PHP_VERSION}.list"
            find .build -type f -name config.log -print0 > "$log_list"
            if [[ -s "$log_list" ]]; then
              tar --create --gzip --file logs/configure-logs.tar.gz --null --files-from "$log_list"
            fi
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostics-php-${{ matrix.php }}
          path: |
            logs/
            dist/logs/
            dist/php-${{ matrix.php }}/manifest.json
          if-no-files-found: warn
          retention-days: 14

  required:
    name: All supported runtimes passed
    if: always()
    needs: [source, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$RUNTIME_RESULT" = success
