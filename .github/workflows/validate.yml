name: Validate PHP int64

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: int64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.5.0'
          cache: npm
      - name: Install validation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq shellcheck php-cli
          npm ci --ignore-scripts
      - name: Validate source and fast contracts
        run: bash scripts/check.sh

  runtime:
    name: PHP ${{ matrix.php }} build and runtime
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.5.0'
          cache: npm
      - name: Install test tooling
        timeout-minutes: 20
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit
          docker version
          docker compose version
      - name: Build pinned PHP and matching extensions
        run: |
          set -euo pipefail
          mkdir -p logs
          bash scripts/build.sh "$PHP_VERSION" 2>&1 | tee "logs/build-php${PHP_VERSION}.log"
      - name: Validate patched bridge source contracts
        run: |
          upstream_dir=$(bash scripts/workspace.sh "$PHP_VERSION")
          VRZNO_SOURCE_ROOT="$(dirname "$upstream_dir")/vrzno" node --test tests/bridge/source-contract.mjs
      - name: Package and extract the distribution
        run: |
          bash scripts/package.sh "$PHP_VERSION"
          archive="php-wasm-int64-$(cat VERSION)-php${PHP_VERSION}.tar.gz"
          (cd dist/releases && sha256sum --check "$archive.sha256")
          mkdir -p dist/verified
          tar --extract --gzip --file "dist/releases/$archive" --directory dist/verified --no-same-owner
      - name: Verify distribution contents and hashes
        run: node scripts/verify-artifact.mjs "dist/verified/php-$PHP_VERSION" "$PHP_VERSION"
      - name: Exercise embedded, CLI, CGI and debugger runtimes
        timeout-minutes: 15
        run: |
          set -euo pipefail
          node tests/run-runtime.mjs "$PHP_VERSION" "dist/verified/php-$PHP_VERSION" 2>&1 | tee "logs/node-php${PHP_VERSION}.log"
      - name: Exercise Chromium, Firefox and WebKit
        timeout-minutes: 30
        run: |
          set -euo pipefail
          node tests/browser-test.mjs "$PHP_VERSION" "dist/verified/php-$PHP_VERSION" 2>&1 | tee "logs/browser-php${PHP_VERSION}.log"
      - name: Upload verified archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: int64-php-${{ matrix.php }}
          path: |
            dist/releases/*-php${{ matrix.php }}.tar.gz
            dist/releases/*-php${{ matrix.php }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostics-php-${{ matrix.php }}
          path: |
            logs/
            dist/logs/
            dist/php-${{ matrix.php }}/manifest.json
          if-no-files-found: warn
          retention-days: 14

  required:
    name: All supported runtimes passed
    if: always()
    needs: [source, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$RUNTIME_RESULT" = success
